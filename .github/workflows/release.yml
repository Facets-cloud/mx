name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both architectures
        run: scripts/npm-build.sh "$GITHUB_REF_NAME"
      - name: Test the arm64 build
        run: MX_BIN=npm/mx-darwin-arm64/bin/mx python3 tests/selftest.py --only protocol,gate,settle,diff
      - name: Tarballs
        run: |
          mkdir dist
          for arch in arm64 x64; do
            tar -czf "dist/mx_darwin_${arch}.tar.gz" -C "npm/mx-darwin-${arch}" bin/mx LICENSE THIRD_PARTY_NOTICES
          done
      # The Claude Desktop extension carries one universal binary; mx.mcpb is
      # the same file under a name releases/latest/download can link to. It is
      # signed with the self-signed certificate from
      # packaging/mcpb/make-signing-cert.sh, before the copy and before
      # checksums.txt, so both files and the checksums carry the signature.
      # Without the two secrets it goes out unsigned. Only this step sees them.
      - name: Desktop extension
        env:
          VERSION: ${{ github.ref_name }}
          MCPB_SIGNING_CERT: ${{ secrets.MCPB_SIGNING_CERT }}
          MCPB_SIGNING_KEY: ${{ secrets.MCPB_SIGNING_KEY }}
        run: |
          universal=$(mktemp -d)/mx
          lipo -create npm/mx-darwin-arm64/bin/mx npm/mx-darwin-x64/bin/mx -output "$universal"
          lipo -info "$universal"
          node packaging/mcpb/build.mjs "$VERSION" "$universal" dist
          bundle="dist/mx-${VERSION#v}.mcpb"
          if [ -n "$MCPB_SIGNING_CERT" ] && [ -n "$MCPB_SIGNING_KEY" ]; then
            keys=$(mktemp -d)
            trap 'rm -rf "$keys"' EXIT
            (umask 077; printf '%s\n' "$MCPB_SIGNING_CERT" > "$keys/cert.pem"; printf '%s\n' "$MCPB_SIGNING_KEY" > "$keys/key.pem")
            npx -y @anthropic-ai/mcpb@2.1.2 sign "$bundle" --cert "$keys/cert.pem" --key "$keys/key.pem"
            cp "$bundle" dist/mx.mcpb
          else
            echo "::notice title=mx.mcpb is unsigned::MCPB_SIGNING_CERT and MCPB_SIGNING_KEY aren't set; packaging/mcpb/make-signing-cert.sh makes them."
          fi
      - name: Checksums
        run: (cd dist && shasum -a 256 *.tar.gz *.mcpb > checksums.txt)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - name: Configure .npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: npm publish
        run: |
          # Platform packages first: @facets-cloud/mx depends on them.
          for p in npm/mx-darwin-arm64 npm/mx-darwin-x64; do
            (cd "$p" && npm publish --access public)
          done
          # npm takes minutes to serve a new version. Publishing the launcher
          # before its binaries are served makes npx install it without them,
          # so wait (up to 15 minutes).
          v="${GITHUB_REF_NAME#v}"
          for p in mx-darwin-arm64 mx-darwin-x64; do
            for i in $(seq 1 60); do
              npm view "@facets-cloud/$p@$v" version --prefer-online >/dev/null 2>&1 && break
              [ "$i" = 60 ] && { echo "@facets-cloud/$p@$v never appeared"; exit 1; }
              sleep 15
            done
          done
          (cd npm/mx && npm publish --access public)
      - name: Remove .npmrc
        if: always()
        run: rm -f ~/.npmrc
      - name: Bump the plugin version on main
        # npm-build.sh set plugin.json's version to the tag. Commit it to main
        # so `claude plugin update` sees the new release.
        run: |
          v="${GITHUB_REF_NAME#v}"
          git checkout -- plugin/.claude-plugin/plugin.json
          git fetch origin main
          git checkout -B main origin/main
          node -e '
            const fs = require("fs"), f = "plugin/.claude-plugin/plugin.json", v = process.argv[1];
            const p = JSON.parse(fs.readFileSync(f)); p.version = v;
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
          ' "$v"
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "plugin $v"
          git push origin main
