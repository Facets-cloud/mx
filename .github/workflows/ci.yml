name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      # The groups that need no Accessibility grant and no GUI.
      - run: python3 tests/selftest.py --only protocol,gate,settle,diff
      # The CLI and its background process (mx serve); no Accessibility grant needed.
      - run: python3 tests/clitest.py --only protocol
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desktop extension tests
        run: node --test 'packaging/mcpb/*.test.mjs'
      - name: Claude Code plugin tests
        run: node --test 'packaging/plugin/*.test.mjs'
